version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: blog_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: blog_admin
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog_backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/blog_admin
      JWT_SECRET: blog_admin_jwt_secret
      JWT_EXPIRES_IN: 24h
      JWT_REFRESH_EXPIRES_IN: 7d
      ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb

volumes:
  mongodb_data:
